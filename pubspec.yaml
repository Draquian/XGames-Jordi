name: navidad_de_jordi
description: "Marcador de minijocs per a una festa, sense Internet ni servidors externs."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Estat de l'aplicació
  provider: ^6.1.2

  # Persistència local (dispositiu del màster)
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4

  # Caché local del jugador + identitat persistent del dispositiu
  shared_preferences: ^2.3.2
  uuid: ^4.5.1

  # Comunicació local (WiFi/LAN), sense servidors externs
  web_socket_channel: ^3.0.1
  network_info_plus: ^6.1.1

  # Codi QR d'incorporació
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # Mantenir la pantalla encesa al dispositiu del màster durant la sessió
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/logo.png